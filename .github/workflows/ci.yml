name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_PATH: ':memory:'
          LOG_LEVEL: silent
          PYTHON_PATH: python3

      - name: Upload coverage (optional)
        if: success()
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DB_PATH: ':memory:'

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit (production dependencies, high+ severity)
        run: npm audit --omit=dev --audit-level=high

      - name: pip-audit (Python dependencies)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Test (component + accessibility, via jest-axe)
        run: npm test
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

      - name: npm audit (production dependencies, high+ severity)
        run: npm audit --omit=dev --audit-level=high
        working-directory: client
