name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_PATH: ':memory:'
          LOG_LEVEL: silent
          PYTHON_PATH: python3

      - name: Upload coverage (optional)
        if: success()
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DB_PATH: ':memory:'

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit (production dependencies, high+ severity)
        run: npm audit --omit=dev --audit-level=high

      - name: pip-audit (Python dependencies)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Test (component + accessibility, via jest-axe)
        run: npm test
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

      - name: npm audit (production dependencies, high+ severity)
        run: npm audit --omit=dev --audit-level=high
        working-directory: client

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (validation only, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: docubil:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start it the way docker-compose.release.yml does (a fresh named volume
      # at /data, running as the image's non-root user) and wait for /health.
      # Catches startup failures a build alone can't, such as /data
      # permissions on a first install.
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e UPLOAD_DIR=/data/uploads -e OUTPUT_DIR=/data/output \
            -e REPORTS_DIR=/data/reports -e DB_PATH=/data/jobs.json \
            -v smoke_data:/data docubil:ci
          for i in $(seq 30); do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

  # Only on the Version Packages PR (branch changeset-release/main, opened by
  # .github/workflows/release.yml): fails until that version's release
  # highlights file exists, so a release can't be merged without them.
  release-highlights:
    name: Release highlights
    if: github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check this release has highlights
        run: node scripts/build-release-notes.mjs --check-highlights "$(node -p "require('./package.json').version")"
