name: Feature request
description: Suggest an idea or improvement for Docubil
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! It helps to check [PLAN.md](https://github.com/jshields-ca/Docubil/blob/main/PLAN.md) first: your idea may already be planned, or there may be a decision in [DECISIONS.md](https://github.com/jshields-ca/Docubil/blob/main/DECISIONS.md) that affects it.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that's impossible or awkward today? An accessibility gap, a workflow limitation, a deployment constraint?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: dropdown
    id: context
    attributes:
      label: Where would you use it?
      multiple: true
      options:
        - On a work computer
        - Self-hosted for a team or organisation
        - Personal use
        - Checking documents before publishing them
        - Fixing documents someone else made
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or approaches you've tried.
    validations:
      required: false
