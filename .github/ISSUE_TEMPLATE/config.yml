# Shown alongside the issue forms on "New issue", so questions and ideas go
# to Discussions and security reports stay private.
blank_issues_enabled: true
contact_links:
  - name: Questions and help
    url: https://github.com/jshields-ca/Docubil/discussions/categories/q-a
    about: Setting something up, or not sure it's a bug? Ask in Discussions.
  - name: Ideas and feedback
    url: https://github.com/jshields-ca/Docubil/discussions/categories/ideas
    about: Talk through an idea before it becomes a feature request.
  - name: Roadmap and decisions
    url: https://github.com/jshields-ca/Docubil/blob/main/PLAN.md
    about: What's planned, what's done, and why (see also DECISIONS.md).
  - name: Report a security vulnerability
    url: https://github.com/jshields-ca/Docubil/security/advisories/new
    about: Please report security problems privately, not as a public issue (see SECURITY.md).
